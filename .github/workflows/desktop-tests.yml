name: Desktop tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests use Node built-ins and need no dependency installation.
      - run: npm test
